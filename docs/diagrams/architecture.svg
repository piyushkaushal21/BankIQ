<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <style>
    .bg { fill: #f6f8fa }
    .box { fill: #ffffff; stroke: #0B2545; stroke-width:2; rx:8 }
    .label { font-family: Inter, Arial, sans-serif; fill: #0B2545; font-size:16px }
    .title { font-family: Inter, Arial, sans-serif; fill: #0B2545; font-size:20px; font-weight:700 }
    .arrow { stroke: #0B2545; stroke-width:2; marker-end: url(#arrowhead) }
  </style>
  <rect width="100%" height="100%" class="bg" />
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0B2545" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="36" class="title">Architecture Diagram — BankIQ</text>

  <!-- Browser -->
  <rect x="60" y="80" width="220" height="80" class="box" />
  <text x="170" y="125" text-anchor="middle" class="label">Browser
    <tspan x="170" dy="18" font-size="12">(Lovable + React)</tspan>
  </text>

  <!-- Server -->
  <rect x="360" y="80" width="220" height="80" class="box" />
  <text x="470" y="105" text-anchor="middle" class="label">Edge / Server Functions</text>
  <text x="470" y="125" text-anchor="middle" font-size="12" fill="#0B2545">(session middleware)</text>

  <!-- Supabase -->
  <rect x="680" y="40" width="220" height="80" class="box" />
  <text x="790" y="85" text-anchor="middle" class="label">Supabase
    <tspan x="790" dy="18" font-size="12">Auth · DB · Storage</tspan>
  </text>

  <!-- Dify -->
  <rect x="680" y="160" width="220" height="80" class="box" />
  <text x="790" y="205" text-anchor="middle" class="label">Dify (LLM)
    <tspan x="790" dy="18" font-size="12">Chat · RAG · KYC</tspan>
  </text>

  <!-- Arrows -->
  <line x1="280" y1="120" x2="360" y2="120" class="arrow" />
  <line x1="580" y1="120" x2="680" y2="120" class="arrow" />
  <line x1="580" y1="120" x2="680" y2="200" class="arrow" />

  <!-- Callouts -->
  <text x="360" y="200" class="label" font-size="13">Auth & Sessions → Server</text>
  <text x="820" y="260" class="label" font-size="13">RAG → LLM with citations</text>

  <!-- Footer legend -->
  <text x="40" y="620" class="label" font-size="13">Note: This SVG is a lightweight, repo-hosted diagram to ensure visibility on GitHub.</text>
</svg>
